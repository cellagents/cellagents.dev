# Jekyll site config. GitHub Pages reads this on push to main.
#
# Human-visible strings (title, taglines, nav labels, link targets) live in
# _data/i18n/<lang>.yml. The layout picks the file matching page.lang
# (default: en). Add a new language by dropping another file in that folder.

url: https://cellagents.dev

# Default language used when a page does not declare `lang:` in its front
# matter. English pages at the site root use this; Czech pages under /cs/
# set `lang: cs` themselves.
default_lang: en

# Known languages. The language switcher iterates this list.
languages:
  - en
  - cs

# No plugins beyond what GitHub Pages ships; no third-party gems.
plugins: []

# Keep the dev tooling out of the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache

# Permalinks: `/developers/`, `/educators/` etc. - friendlier than `.html`.
permalink: pretty
